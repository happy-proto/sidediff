[tools]
"cargo:cargo-nextest" = "0.9.148"
gh = "2.102.0"
"github:github/gh-actions-lock" = { version = "0.2.0", bin = "gh-actions-lock" }

[settings]
activate_aggressive = true

[tasks.check]
description = "检查格式、Clippy 和 Actions 锁文件，不执行测试"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "gh-actions-lock --verify",
]

[tasks.actions-lock-update]
description = "更新 GitHub Actions 原生锁文件"
run = "gh-actions-lock --no-narrow"

[tasks.test]
description = "运行常规测试与真实终端回归"
# 单项测试超时由 .config/nextest.toml 统一配置。
run = "cargo nextest run --config-file .config/nextest.toml --cargo-quiet --status-level fail --final-status-level fail --failure-output final --success-output never --show-progress none --no-tests pass"

[tasks.ghostty-e2e]
description = "在 PTY 和 Ghostty 终端内核中验证屏幕颜色"
run = "cargo nextest run --features ghostty-e2e --test ghostty_terminal_e2e --config-file .config/nextest.toml --cargo-quiet --status-level fail --final-status-level fail --failure-output final --success-output never --show-progress none --no-tests pass"

[tasks.ghostty-e2e.tools]
zig = "0.16.0"

[tasks.install]
description = "从当前源码安装 sidediff"
run = "cargo install --path . --locked"
